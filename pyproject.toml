[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ednhemo"
dynamic = ["version"]
description = "Small-hemorrhage-aware intracranial hemorrhage detection on CT with a 2D U-Net."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Chekalil Aimene Charef Eddine" },
  { name = "Ouadah Mustapha" },
]
keywords = [
  "intracranial hemorrhage",
  "ICH",
  "CT",
  "medical imaging",
  "segmentation",
  "U-Net",
  "deep learning",
  "BHSD",
  "PyTorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "nibabel>=5.0",
  "pillow>=9.0",
  "matplotlib>=3.7",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/aimenachraff-jpg/ednhemo"
Documentation = "https://github.com/aimenachraff-jpg/ednhemo#readme"
Repository = "https://github.com/aimenachraff-jpg/ednhemo"
Issues = "https://github.com/aimenachraff-jpg/ednhemo/issues"
Changelog = "https://github.com/aimenachraff-jpg/ednhemo/blob/main/CHANGELOG.md"

[project.scripts]
ednhemo = "ednhemo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ednhemo = ["weights/*.pt", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "ednhemo._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
